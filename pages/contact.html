<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Contact</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="navbar navbar-expand-sm sticky-top" id="nav-header">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">
                <img src="/images/logo_design_marita.svg" alt="Marita Aziga's Logo" class="logo">
            </a>
            <ul class="navbar-nav me-2 mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/pages/about.html">About</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Projects
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="../pages/art.html">Design</a></li>
                        <li><a class="dropdown-item" href="../pages/frontend.html">Front-End</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="btn btn-primary" aria-current="page" href="../pages/contact.html" role="button">Contact</a>
                </li>                
            </ul>
        </div>
    </header>
   <main class="flex-grow-1">
        <div class="container p-lg-5">
            <h1 className="heading">Want to get in touch?</h1>
            <h4>Leave a message or check out my social media. I'll get back to you soon.</h4>
        </div>
        <div class="container p-lg-5">
            <form id="contactMe">
                <div class="mb-3">
                    <label for="#name">Name</label>
                    <input type="text" class="form-control" name="Name" id="name" required/>   
                </div>
                <div class="mb-3">
                    <label for="#email">Email</label>
                    <input type="email" class="form-control" name="email" id="email" required/>
                </div>
                <div class="mb-3">
                    <label for="message">Message</label>
                    <textarea name="message" class="form-control" id="message" required></textarea>
                </div>
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">Submit</button> 
                </div>
            </form>
        </div>
   </main>
    <footer class="container-fluid py-2" id="footer">
        <div class="row g-0">
            <div class="col">
                <h2>Marita Aziga</h2>
            </div>
            <div class="col-auto">
                <ul class="navbar-nav mb-2 mb-lg-0" id="footer-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="../pages/about.html">About</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Projects
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="../pages/art.html">Design</a></li>
                            <li><a class="dropdown-item" href="../pages/frontend.html">Front-End</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="../pages/contact.html">Contact</a>
                    </li>                
                </ul>
            </div>
        </div>
        <div class="row g-0">
            <div class="col">
                <p>© 2025 Marita Aziga - All rights reserved</p>
            </div>
        </div>
    </footer>
    <script scr="../js/script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</html>
